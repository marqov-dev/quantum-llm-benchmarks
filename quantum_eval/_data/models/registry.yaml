# Model registry for quantum-llm-benchmarks.
# Community members can open a PR to add a model.
# provider: anthropic | openai | google | compat
# api_key_env: environment variable name for the API key (use empty string for local Ollama)
# base_url: required for compat provider; null uses the SDK default
# temperature: per-model default. Will be superseded by methodology-locked value after methodology pass.
# max_tokens: generation limit per example.

models:
  - id: claude-sonnet-4-6
    label: "Claude Sonnet 4.6"
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: null
    temperature: 1.0
    max_tokens: 4096
    max_retries: 2
    notes: "Native Anthropic SDK."

  - id: gemini-2.5-flash
    label: "Gemini 2.5 Flash"
    provider: google
    api_key_env: GEMINI_API_KEY
    base_url: null
    temperature: 0.2
    max_tokens: 4096
    max_retries: 2

  - id: gemini-2.5-pro
    label: "Gemini 2.5 Pro"
    provider: google
    api_key_env: GEMINI_API_KEY
    base_url: null
    temperature: 0.2
    max_tokens: 4096
    max_retries: 2
    notes: "Thinking model. Underperforms Flash on this benchmark."

