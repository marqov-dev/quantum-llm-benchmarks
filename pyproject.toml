[project]
name = "quantum-llm-benchmarks"
version = "0.1.0"
description = "Open benchmark for evaluating LLMs on quantum code generation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.91",
    "openai>=1.0",
    "google-generativeai>=0.8",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "qiskit>=2.0",
    "qiskit-aer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
quantum-llm-benchmarks = "quantum_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quantum_eval"]

[tool.hatch.build.targets.wheel.force-include]
"quantum_eval/_data" = "quantum_eval/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
